<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comida Rápida - Notificaciones Reales</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f8f9fa; 
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            background: #ff6b35;
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .productos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        
        .producto {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .producto:hover { transform: translateY(-3px); }
        
        .producto-icono { font-size: 2rem; margin-bottom: 10px; }
        
        .carrito {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }
        
        .item-carrito {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .total { 
            font-size: 1.2rem; 
            font-weight: bold; 
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #333;
        }
        
        .boton {
            width: 100%;
            padding: 15px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            transition: background 0.3s;
        }
        
        .boton:hover { background: #ff5722; }
        
        .boton:disabled { background: #ccc; cursor: not-allowed; }
        
        .boton-permisos {
            background: #4CAF50;
            margin-bottom: 15px;
        }
        
        .boton-permisos:hover { background: #45a049; }
        
        .estado {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 4px solid #2196f3;
            text-align: center;
        }
        
        .estado h3 { color: #1976d2; margin-bottom: 10px; }
        
        footer {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍕 COMIDA EXPRESS</h1>
        <p>Pide y recibe notificaciones en tu celular</p>
    </div>

    <div class="estado">
        <h3>🔔 Estado de Notificaciones</h3>
        <p id="estadoTexto">Cargando...</p>
        <button class="boton boton-permisos" id="btnPermisos">
            ACTIVAR NOTIFICACIONES
        </button>
    </div>

    <h2>📋 Menú</h2>
    <div class="productos" id="productos">
        <!-- Productos cargados por JS -->
    </div>

    <div class="carrito">
        <h2>🛒 Tu Pedido</h2>
        <div id="listaCarrito">
            <p style="text-align:center; color:#999;">Carrito vacío</p>
        </div>
        <div class="total">
            <span>Total:</span>
            <span id="total">$0.00</span>
        </div>
        
        <button class="boton" id="btnPedir" disabled>
            ✅ CONFIRMAR PEDIDO
        </button>
    </div>

    <footer>
        <p><strong>⚠️ IMPORTANTE:</strong> Usa CHROME en Android</p>
        <p>Acepta los permisos cuando el navegador lo pida</p>
        <p>Las notificaciones aparecerán en la BANDEJA del celular</p>
    </footer>

    <script>
        // ====== CONFIGURACIÓN INICIAL ======
        const productos = [
            { id: 1, nombre: "Hamburguesa", icono: "🍔", precio: 8.99 },
            { id: 2, nombre: "Pizza", icono: "🍕", precio: 12.99 },
            { id: 3, nombre: "Papas Fritas", icono: "🍟", precio: 4.99 },
            { id: 4, nombre: "Refresco", icono: "🥤", precio: 2.99 },
            { id: 5, nombre: "Hot Dog", icono: "🌭", precio: 5.99 },
            { id: 6, nombre: "Helado", icono: "🍦", precio: 3.99 }
        ];

        let carrito = [];
        let notificacionesActivadas = false;

        // ====== ELEMENTOS DOM ======
        const elementos = {
            productos: document.getElementById('productos'),
            listaCarrito: document.getElementById('listaCarrito'),
            total: document.getElementById('total'),
            btnPedir: document.getElementById('btnPedir'),
            btnPermisos: document.getElementById('btnPermisos'),
            estadoTexto: document.getElementById('estadoTexto')
        };

        // ====== INICIALIZAR ======
        function init() {
            cargarProductos();
            verificarNotificaciones();
            actualizarCarrito();
            
            // Eventos
            elementos.btnPermisos.addEventListener('click', activarNotificaciones);
            elementos.btnPedir.addEventListener('click', confirmarPedido);
        }

        // ====== CARGAR PRODUCTOS ======
        function cargarProductos() {
            elementos.productos.innerHTML = '';
            
            productos.forEach(producto => {
                const div = document.createElement('div');
                div.className = 'producto';
                div.innerHTML = `
                    <div class="producto-icono">${producto.icono}</div>
                    <div><strong>${producto.nombre}</strong></div>
                    <div>$${producto.precio.toFixed(2)}</div>
                `;
                
                div.addEventListener('click', () => {
                    agregarAlCarrito(producto);
                    // Vibración en móviles
                    if (navigator.vibrate) navigator.vibrate(100);
                });
                
                elementos.productos.appendChild(div);
            });
        }

        // ====== AGREGAR AL CARRITO ======
        function agregarAlCarrito(producto) {
            const existente = carrito.find(item => item.id === producto.id);
            
            if (existente) {
                existente.cantidad++;
            } else {
                carrito.push({
                    id: producto.id,
                    nombre: producto.nombre,
                    icono: producto.icono,
                    precio: producto.precio,
                    cantidad: 1
                });
            }
            
            actualizarCarrito();
            
            // Enviar notificación inmediata
            if (notificacionesActivadas) {
                enviarNotificacion(
                    `${producto.icono} Agregado al carrito`,
                    `Has añadido ${producto.nombre} - $${producto.precio.toFixed(2)}`
                );
            }
        }

        // ====== ACTUALIZAR CARRITO ======
        function actualizarCarrito() {
            elementos.listaCarrito.innerHTML = '';
            
            if (carrito.length === 0) {
                elementos.listaCarrito.innerHTML = '<p style="text-align:center; color:#999;">Carrito vacío</p>';
                elementos.btnPedir.disabled = true;
                elementos.total.textContent = '$0.00';
                return;
            }
            
            elementos.btnPedir.disabled = false;
            let total = 0;
            
            carrito.forEach(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                
                const div = document.createElement('div');
                div.className = 'item-carrito';
                div.innerHTML = `
                    <div>
                        <strong>${item.icono} ${item.nombre}</strong>
                        <div style="font-size:0.9em; color:#666">${item.cantidad} x $${item.precio.toFixed(2)}</div>
                    </div>
                    <div>$${subtotal.toFixed(2)}</div>
                `;
                elementos.listaCarrito.appendChild(div);
            });
            
            elementos.total.textContent = `$${total.toFixed(2)}`;
        }

        // ====== SISTEMA DE NOTIFICACIONES ======
        function verificarNotificaciones() {
            if (!("Notification" in window)) {
                elementos.estadoTexto.innerHTML = "❌ Tu navegador no soporta notificaciones";
                elementos.btnPermisos.disabled = true;
                elementos.btnPermisos.textContent = "NO COMPATIBLE";
                return;
            }
            
            if (Notification.permission === "granted") {
                notificacionesActivadas = true;
                elementos.estadoTexto.innerHTML = "✅ Notificaciones ACTIVADAS";
                elementos.btnPermisos.textContent = "✅ ACTIVADAS";
                elementos.btnPermisos.style.background = "#4CAF50";
                elementos.btnPermisos.disabled = true;
            } else if (Notification.permission === "denied") {
                elementos.estadoTexto.innerHTML = "❌ Notificaciones BLOQUEADAS - Ve a configuración del navegador";
                elementos.btnPermisos.textContent = "DESBLOQUEAR MANUALMENTE";
                elementos.btnPermisos.style.background = "#f44336";
            } else {
                elementos.estadoTexto.innerHTML = "⚠️ Haz clic en ACTIVAR NOTIFICACIONES";
            }
        }

        async function activarNotificaciones() {
            try {
                const permiso = await Notification.requestPermission();
                
                if (permiso === "granted") {
                    notificacionesActivadas = true;
                    elementos.estadoTexto.innerHTML = "✅ ¡Notificaciones ACTIVADAS!";
                    elementos.btnPermisos.textContent = "✅ ACTIVADAS";
                    elementos.btnPermisos.style.background = "#4CAF50";
                    elementos.btnPermisos.disabled = true;
                    
                    // Enviar notificación de prueba
                    enviarNotificacion(
                        "¡Notificaciones Activadas! 🎉",
                        "Ahora recibirás alertas de tus pedidos en la bandeja del celular"
                    );
                    
                } else {
                    elementos.estadoTexto.innerHTML = "❌ Permisos DENEGADOS";
                    elementos.btnPermisos.textContent = "INTENTAR DE NUEVO";
                    elementos.btnPermisos.style.background = "#f44336";
                    alert("Debes aceptar los permisos para recibir notificaciones");
                }
            } catch (error) {
                console.error("Error:", error);
                elementos.estadoTexto.innerHTML = "❌ Error al activar notificaciones";
            }
        }

        function enviarNotificacion(titulo, mensaje) {
            if (!notificacionesActivadas) return;
            
            // Configurar la notificación
            const opciones = {
                body: mensaje,
                icon: crearIcono("🍕"),
                badge: crearIcono("📱"),
                vibrate: [200, 100, 200, 100, 200], // Patrón de vibración
                tag: 'comida-' + Date.now(),
                requireInteraction: false,
                silent: false,
                timestamp: Date.now(),
                data: {
                    url: window.location.href,
                    tipo: 'pedido-comida'
                },
                actions: [
                    {
                        action: 'ver',
                        title: '📱 Ver Pedido'
                    }
                ]
            };
            
            // Crear y mostrar la notificación
            const notificacion = new Notification(titulo, opciones);
            
            // Cuando el usuario hace clic en la notificación
            notificacion.onclick = function(event) {
                event.preventDefault();
                window.focus();
                notificacion.close();
                
                // Mostrar alerta en la página
                alert("Notificación clickeada: " + titulo);
            };
            
            // Cuando se cierra la notificación
            notificacion.onclose = function() {
                console.log("Notificación cerrada:", titulo);
            };
            
            // Auto-cerrar después de 7 segundos
            setTimeout(() => {
                notificacion.close();
            }, 7000);
            
            return notificacion;
        }

        function crearIcono(emoji) {
            // Crear icono dinámico
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            // Fondo circular
            ctx.fillStyle = '#ff6b35';
            ctx.beginPath();
            ctx.arc(64, 64, 60, 0, Math.PI * 2);
            ctx.fill();
            
            // Texto/emoji
            ctx.font = '70px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white';
            ctx.fillText(emoji, 64, 64);
            
            return canvas.toDataURL();
        }

        // ====== CONFIRMAR PEDIDO ======
        function confirmarPedido() {
            if (carrito.length === 0) {
                alert("Primero agrega productos al carrito");
                return;
            }
            
            // Calcular total
            const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            
            // Mostrar resumen
            let resumen = "📋 RESUMEN DEL PEDIDO:\n\n";
            carrito.forEach(item => {
                resumen += `${item.icono} ${item.nombre} x${item.cantidad} - $${(item.precio * item.cantidad).toFixed(2)}\n`;
            });
            resumen += `\n💰 TOTAL: $${total.toFixed(2)}`;
            
            // Confirmar con el usuario
            if (confirm(resumen + "\n\n¿Confirmar pedido?")) {
                // ENVIAR NOTIFICACIÓN DE CONFIRMACIÓN
                if (notificacionesActivadas) {
                    enviarNotificacion(
                        "✅ Pedido Confirmado",
                        `Tu pedido de $${total.toFixed(2)} ha sido confirmado. Llegará en 15-20 minutos.`
                    );
                    
                    // Simular estado del pedido con más notificaciones
                    setTimeout(() => {
                        enviarNotificacion(
                            "👨‍🍳 En Preparación",
                            "Tu pedido está siendo preparado ahora mismo"
                        );
                    }, 2000);
                    
                    setTimeout(() => {
                        enviarNotificacion(
                            "🚗 En Camino",
                            "¡Tu pedido está en camino! Prepárate para recibirlo"
                        );
                    }, 5000);
                    
                    setTimeout(() => {
                        enviarNotificacion(
                            "🎉 ¡Pedido Entregado!",
                            "Tu comida ha llegado. ¡Buen provecho!"
                        );
                    }, 8000);
                }
                
                // Limpiar carrito
                carrito = [];
                actualizarCarrito();
                
                // Mostrar mensaje final
                alert("🎉 ¡Pedido confirmado exitosamente!\n\n" + 
                      "Recibirás notificaciones en tu celular con el estado del pedido.\n" +
                      "Revisa la bandeja de notificaciones.");
                
            } else {
                alert("Pedido cancelado");
            }
        }

        // ====== DETECTAR DISPOSITIVO MÓVIL ======
        function esMovil() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        // ====== INICIAR ======
        window.addEventListener('DOMContentLoaded', init);

        // Mensaje inicial
        if (esMovil()) {
            console.log("📱 Dispositivo móvil detectado - Perfecto para notificaciones");
            document.querySelector('footer p').innerHTML = "<strong>✅ PERFECTO:</strong> Estás en un celular";
        }

        // Auto-activar si ya tiene permisos
        setTimeout(() => {
            if (Notification.permission === "granted" && !notificacionesActivadas) {
                notificacionesActivadas = true;
                elementos.estadoTexto.innerHTML = "✅ Notificaciones ACTIVADAS";
                elementos.btnPermisos.textContent = "✅ ACTIVADAS";
                elementos.btnPermisos.style.background = "#4CAF50";
                elementos.btnPermisos.disabled = true;
            }
        }, 1000);

    </script>
</body>
</html>
